<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Creator-curated stays"><link rel="stylesheet" href="/styles.css"><title>Travel With Creator</title></head>
<body><nav class="nav"><div class="container nav-inner"><a class="brand js-store" href="/">Travel With Creator</a><div class="nav-actions"><a class="btn ghost" href="#stays">Stays</a><a class="btn ghost" href="/signup.html">Create account</a><a class="btn secondary" href="/login.html">Creator login</a></div></div></nav>
<main><section class="hero"><div class="container"><div class="eyebrow">Curated by <span class="js-creator">Creator</span></div><h1 id="heroTitle">Stay where I stayed.</h1><p id="heroSubtitle"></p><div class="hero-actions"><a href="#stays" class="btn">Explore my stays</a></div></div></section>
<section class="section" id="stays"><div class="container"><div class="section-head"><div><div class="eyebrow">My travel collection</div><h2>Places worth booking</h2></div><p class="muted" id="tagline"></p></div><div class="grid" id="propertyGrid"></div></div></section></main>
<footer class="footer"><div class="container">Direct payments are processed securely by Stripe. Airbnb bookings are completed on Airbnb.</div></footer>
<script src="/app.js"></script><script>(async()=>{captureRef();await applyConfig();const rows=await api("/api/properties"),r=getRef();$("#propertyGrid").innerHTML=rows.map(p=>`<a class="card" href="/property.html?slug=${encodeURIComponent(p.slug)}${r?`&ref=${encodeURIComponent(r)}`:""}"><div class="card-media"><img src="${esc(p.image_url)}" alt="${esc(p.title)}"></div><div class="card-body"><h3 class="card-title">${esc(p.title)}</h3><div class="meta"><span>${esc(p.location)}, ${esc(p.country)}</span><span class="price">${p.allow_direct?`${money(p.nightly_price_cents,p.currency)} / night`:"Airbnb"}</span></div></div></a>`).join("")})();</script></body></html>
