<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Stay</title></head>
<body><nav class="nav"><div class="container nav-inner"><a class="brand js-store" href="/">Travel With Creator</a><a class="btn secondary" href="/">All stays</a></div></nav>
<main class="container"><div class="property-layout"><section><div class="cover"><img id="cover" alt=""></div><div class="eyebrow" id="location" style="margin-top:24px"></div><h1 class="property-title" id="title"></h1><p class="muted" id="description" style="font-size:18px;line-height:1.7"></p></section>
<aside class="panel sticky"><div id="priceBox"></div><form id="bookingForm"><div class="row"><div class="field"><label>Check-in</label><input required type="date" name="checkIn"></div><div class="field"><label>Check-out</label><input required type="date" name="checkOut"></div></div><div class="field"><label>Guests</label><input required type="number" min="1" max="30" value="2" name="guests"></div><div class="field"><label>Name</label><input required name="guestName"></div><div class="field"><label>Email</label><input required type="email" name="guestEmail"></div><div class="field"><label>Phone / WhatsApp</label><input name="guestPhone"></div><button class="btn full">Book direct with Stripe</button></form><div class="separator"></div><a id="airbnbBtn" class="btn secondary full">Book on Airbnb</a><div class="notice" style="margin-top:14px">Choose direct checkout or continue to the creator's Airbnb link.</div><p id="error" class="small" style="color:#a02020"></p></aside></div></main>
<script src="/app.js"></script><script>(async()=>{captureRef();await applyConfig();const slug=new URLSearchParams(location.search).get("slug"),p=await api(`/api/properties/${encodeURIComponent(slug)}`);$("#cover").src=p.image_url;$("#title").textContent=p.title;$("#location").textContent=`${p.location} • ${p.country}`;$("#description").textContent=p.description;$("#priceBox").innerHTML=p.allow_direct?`<div class="eyebrow">Direct booking</div><h2 style="margin:8px 0 18px">${money(p.nightly_price_cents,p.currency)} <span class="muted" style="font-size:14px">/ night</span></h2>`:"";if(!p.allow_direct)$("#bookingForm").classList.add("hidden");if(p.airbnb_url)$("#airbnbBtn").href=`/api/go/airbnb/${p.id}?ref=${encodeURIComponent(getRef())}`;else $("#airbnbBtn").classList.add("hidden");$("#bookingForm").onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const f=Object.fromEntries(new FormData(e.currentTarget).entries()),x=await api("/api/checkout",{method:"POST",body:JSON.stringify({...f,propertyId:p.id,referralCode:getRef()})});location.href=x.url}catch(err){$("#error").textContent=err.message;b.disabled=false}}})();</script></body></html>
