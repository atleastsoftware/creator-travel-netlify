<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Booking received</title></head><body><main class="success"><div class="success-box"><div class="eyebrow">Booking received</div><h1 style="font-size:50px">Thank you.</h1><p class="muted" id="status">Checking payment status…</p><div id="details"></div><div style="height:18px"></div><a href="/" class="btn">Back to stays</a></div></main><script src="/app.js"></script><script>(async()=>{const id=new URLSearchParams(location.search).get("booking");try{const b=await api(`/api/bookings/${encodeURIComponent(id)}`);$("#status").textContent=b.payment_status==="paid"?"Payment confirmed. Your booking is recorded.":"Payment is processing. Refresh shortly if needed.";$("#details").innerHTML=`<div class="notice" style="margin-top:20px;text-align:left"><b>${esc(b.property_title)}</b><br>${esc(b.check_in)} → ${esc(b.check_out)} • ${b.nights} night(s)<br><b>${money(b.total_cents,b.currency)}</b><br><span class="small">Reference: ${esc(b.public_id)}</span></div>`}catch(e){$("#status").textContent=e.message}})();</script></body></html>
