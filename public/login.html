<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Creator login</title></head><body><main class="login-shell"><div class="login-card"><div class="eyebrow">Creator portal</div><h1>Welcome back.</h1><p class="muted">Manage stays, Airbnb links and direct bookings.</p><form id="form"><div class="field"><label>Email</label><input type="email" name="email" required></div><div class="field"><label>Password</label><input type="password" name="password" required></div><button class="btn full">Sign in</button><p id="error" class="small" style="color:#a02020"></p></form><p class="small muted" style="margin-top:16px;text-align:center">No creator account yet? <a href="/signup.html" style="font-weight:700;text-decoration:underline">Create one</a></p></div></main><script src="/app.js"></script><script>$("#form").onsubmit=async e=>{e.preventDefault();try{const d=await api("/auth/login",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget).entries()))});localStorage.setItem("creator_token",d.token);location.href="/dashboard.html"}catch(err){$("#error").textContent=err.message}};</script></body></html>
