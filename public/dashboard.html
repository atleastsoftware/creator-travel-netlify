<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Dashboard</title></head><body><div class="dashboard"><aside class="sidebar"><div class="brand js-store">Travel With Creator</div><a class="side-link active" href="#overview">Overview</a><a class="side-link" href="#properties">Listings</a><a class="side-link" href="#bookings">Bookings</a><a class="side-link" href="/" target="_blank">Open storefront ↗</a><button id="logout" class="btn secondary full" style="margin-top:24px">Log out</button></aside><main class="main"><div class="eyebrow">Creator dashboard</div><h2 style="font-size:42px;letter-spacing:-.05em;margin:10px 0">Your travel storefront</h2><div id="who" class="muted"></div><section id="overview"><div class="metric-grid"><div class="metric"><span class="muted small">Paid bookings</span><b id="mBookings">—</b></div><div class="metric"><span class="muted small">Direct revenue</span><b id="mRevenue">—</b></div><div class="metric"><span class="muted small">Creator commission</span><b id="mCommission">—</b></div><div class="metric"><span class="muted small">Airbnb clicks</span><b id="mClicks">—</b></div></div></section><section id="properties"><div class="toolbar"><h2>Listings</h2><button class="btn" id="newProperty">+ Add listing</button></div><div class="table-wrap"><table><thead><tr><th>Stay</th><th>Location</th><th>Direct</th><th>Nightly</th><th>Commission</th><th>Status</th><th></th></tr></thead><tbody id="propertiesBody"></tbody></table></div></section><section id="bookings" style="margin-top:44px"><div class="toolbar"><h2>Recent bookings</h2></div><div class="table-wrap"><table><thead><tr><th>Property</th><th>Guest</th><th>Dates</th><th>Total</th><th>Commission</th><th>Ref</th><th>Status</th></tr></thead><tbody id="bookingsBody"></tbody></table></div></section></main></div>
<div class="modal" id="modal"><div class="modal-card"><div class="toolbar"><h2 id="modalTitle">Add listing</h2><button class="btn secondary" id="close">Close</button></div><form id="pf"><input type="hidden" name="id"><div class="row"><div class="field"><label>Title</label><input name="title" required></div><div class="field"><label>Slug</label><input name="slug"></div></div><div class="row"><div class="field"><label>City / Area</label><input name="location"></div><div class="field"><label>Country</label><input name="country"></div></div><div class="field"><label>Description</label><textarea name="description"></textarea></div><div class="field"><label>Cover image URL</label><input name="image_url"></div><div class="field"><label>Airbnb link</label><input name="airbnb_url"></div><div class="row"><div class="field"><label>Currency</label><select name="currency"><option>EUR</option><option>USD</option><option>THB</option><option>SGD</option><option>GBP</option></select></div><div class="field"><label>Nightly price</label><input type="number" step=".01" name="nightly_price"></div></div><div class="row"><div class="field"><label>Cleaning fee</label><input type="number" step=".01" name="cleaning_fee"></div><div class="field"><label>Minimum nights</label><input type="number" min="1" name="min_nights" value="1"></div></div><div class="field"><label>Creator commission %</label><input type="number" min="0" max="100" step=".1" name="commission_percent" value="10"></div><div class="row"><label><input type="checkbox" name="allow_direct" checked> Direct Stripe booking</label><label><input type="checkbox" name="published" checked> Published</label></div><div style="height:18px"></div><button class="btn full">Save listing</button><p id="formError" class="small" style="color:#a02020"></p></form></div></div>
<script src="/app.js"></script><script>let props=[],me;async function guard(){try{const d=await api("/api/me");me=d.user;$("#who").textContent=`${me.email} • ${me.role}`}catch{location.href="/login.html";throw 0}}function row(p){return `<tr><td><b>${esc(p.title)}</b><div class="small muted">/${esc(p.slug)}</div></td><td>${esc(p.location)}, ${esc(p.country)}</td><td>${p.allow_direct?"Yes":"No"}</td><td>${money(p.nightly_price_cents,p.currency)}</td><td>${p.commission_percent}%</td><td>${p.published?"Published":"Hidden"}</td><td><button class="btn secondary edit" data-id="${p.id}">Edit</button></td></tr>`}async function load(){const [ps,st]=await Promise.all([api("/api/dashboard/properties"),api("/api/dashboard/stats")]);props=ps;$("#propertiesBody").innerHTML=ps.map(row).join("");const cur=ps[0]?.currency||"EUR";$("#mBookings").textContent=st.booking_count;$("#mRevenue").textContent=money(st.paid_revenue_cents,cur);$("#mCommission").textContent=money(st.paid_commission_cents,cur);$("#mClicks").textContent=st.airbnb_clicks;$("#bookingsBody").innerHTML=st.recent.map(b=>`<tr><td>${esc(b.property_title)}</td><td>${esc(b.guest_name)}</td><td>${esc(b.check_in)} → ${esc(b.check_out)}</td><td>${money(b.total_cents,b.currency)}</td><td>${money(b.commission_cents,b.currency)}</td><td>${esc(b.referral_code||"—")}</td><td><span class="badge ${esc(b.payment_status)}">${esc(b.payment_status)}</span></td></tr>`).join("")||`<tr><td colspan="7">No bookings yet.</td></tr>`}function openModal(p){const f=$("#pf");f.reset();f.id.value=p?.id||"";if(p){["title","location","country","description","image_url","airbnb_url","currency","min_nights","commission_percent"].forEach(k=>f[k].value=p[k]??"");f.nightly_price.value=(p.nightly_price_cents/100).toFixed(2);f.cleaning_fee.value=(p.cleaning_fee_cents/100).toFixed(2);f.allow_direct.checked=p.allow_direct;f.published.checked=p.published;f.slug.value=p.slug;f.slug.disabled=true}else{f.slug.disabled=false;f.min_nights.value=1;f.commission_percent.value=10;f.allow_direct.checked=true;f.published.checked=true}$("#modal").classList.add("open")}(async()=>{await guard();await applyConfig();await load();$("#newProperty").onclick=()=>openModal();$("#close").onclick=()=>$("#modal").classList.remove("open");$("#propertiesBody").onclick=e=>{const b=e.target.closest(".edit");if(b)openModal(props.find(p=>p.id===b.dataset.id))};$("#logout").onclick=()=>{localStorage.removeItem("creator_token");location.href="/login.html"};$("#pf").onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,id=f.id.value,d=Object.fromEntries(new FormData(f).entries());d.allow_direct=f.allow_direct.checked;d.published=f.published.checked;try{await api(id?`/api/dashboard/properties/${id}`:"/api/dashboard/properties",{method:id?"PUT":"POST",body:JSON.stringify(d)});$("#modal").classList.remove("open");await load()}catch(err){$("#formError").textContent=err.message}}})();</script></body></html>
