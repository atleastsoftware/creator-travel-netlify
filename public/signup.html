<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/styles.css">
  <title>Create creator account</title>
</head>
<body>
<main class="login-shell">
  <div class="login-card">
    <div class="eyebrow">Creator onboarding</div>
    <h1>Create your account.</h1>
    <p class="muted">Set up the creator account for this storefront. Once created, you can publish listings, add your Airbnb links and manage direct bookings.</p>

    <div id="closed" class="notice hidden" style="margin:18px 0">
      A creator account already exists for this storefront. Please sign in instead.
      <div style="height:12px"></div>
      <a href="/login.html" class="btn secondary full">Go to sign in</a>
    </div>

    <form id="form">
      <div class="field"><label>Creator name</label><input name="name" required maxlength="100" placeholder="Leo Travel"></div>
      <div class="field"><label>Social handle</label><input name="handle" maxlength="60" placeholder="@leotravel"></div>
      <div class="field"><label>Email</label><input type="email" name="email" required autocomplete="email"></div>
      <div class="field"><label>Password</label><input type="password" name="password" required minlength="8" autocomplete="new-password"></div>
      <div class="field"><label>Confirm password</label><input type="password" name="confirmPassword" required minlength="8" autocomplete="new-password"></div>
      <button class="btn full">Create account</button>
      <p id="error" class="small" style="color:#a02020"></p>
    </form>

    <p class="small muted" style="margin-top:16px;text-align:center">Already set up? <a href="/login.html" style="font-weight:700;text-decoration:underline">Sign in</a></p>
  </div>
</main>
<script src="/app.js"></script>
<script>
const AUTH_ENDPOINT="/.netlify/functions/auth";
(async()=>{
  try{
    const status=await api(`${AUTH_ENDPOINT}?action=status`);
    if(!status.available){
      $("#form").classList.add("hidden");
      $("#closed").classList.remove("hidden");
    }
  }catch(err){
    console.warn("Creator account status unavailable",err);
  }

  $("#form").onsubmit=async e=>{
    e.preventDefault();
    $("#error").textContent="";
    const data=Object.fromEntries(new FormData(e.currentTarget).entries());
    if(data.password!==data.confirmPassword){
      $("#error").textContent="Passwords do not match.";
      return;
    }
    delete data.confirmPassword;
    const btn=e.submitter;
    btn.disabled=true;
    btn.textContent="Creating account…";
    try{
      const d=await api(`${AUTH_ENDPOINT}?action=signup`,{method:"POST",body:JSON.stringify(data)});
      localStorage.setItem("creator_token",d.token);
      location.href="/dashboard.html";
    }catch(err){
      $("#error").textContent=err.message;
      btn.disabled=false;
      btn.textContent="Create account";
    }
  };
})();
</script>
</body>
</html>
